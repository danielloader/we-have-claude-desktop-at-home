[project]
name = "claude-at-home"
version = "0.1.0"
description = "FastAPI chat UI over a pluggable LLM provider, with JWT auth, user admin and swappable chat storage"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "pyjwt>=2.9",
    "anthropic>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
elastic = ["elasticsearch>=8.15"]
apm = [
    "elastic-apm>=6.26.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "anyio>=4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-p anyio"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
